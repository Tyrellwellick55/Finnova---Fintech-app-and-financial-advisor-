{% extends 'audit/base_audit.html' %}
{% block title %}Resolve Risk Flag — Audit — Finnova{% endblock %}

{% block audit_content %}
<div class="audit-header">
  <div><h1 class="audit-title"><i class="fas fa-flag" style="color:var(--yellow);"></i> Resolve Risk Flag</h1>
  <p class="audit-breadcrumb"><a href="{% url 'audit:user_risk' %}">Risk Management</a> → Resolve</p></div>
  <a href="{% url 'audit:user_risk' %}" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Back</a>
</div>
<div class="audit-card">
  <form method="post" action="{% url 'audit:resolve_risk_flag' flag.id %}" style="padding:18px;">{% csrf_token %}
    <div class="form-group">
      <label class="form-label">Resolution notes *</label>
      <textarea name="notes" class="form-control" rows="4" placeholder="Explain how this risk was resolved…" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Mark resolved</button>
  </form>
</div>
{% endblock %}
