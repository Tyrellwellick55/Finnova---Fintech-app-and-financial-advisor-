{% extends 'finnovaapp/base.html' %}
{% block title %}Reset Password — Finnova{% endblock %}
{% block content %}
<div style="max-width:440px;margin:60px auto;">
  <div class="card" style="padding:32px;">
    <h1 style="font-size:1.3rem;margin:0 0 6px;">Reset password</h1>
    <p style="color:var(--text-2);font-size:.88rem;margin:0 0 20px;">Enter your email address and we'll send you a reset link.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:6px;">Send reset link</button>
    </form>
    <a href="{% url 'finnovaapp:login' %}" style="display:block;text-align:center;margin-top:14px;font-size:.86rem;color:var(--brand);">Back to sign in</a>
  </div>
</div>
{% endblock %}
