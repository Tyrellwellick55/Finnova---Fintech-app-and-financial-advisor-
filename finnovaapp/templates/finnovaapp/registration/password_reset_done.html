{% extends 'finnovaapp/base.html' %}
{% block title %}Check your email — Finnova{% endblock %}
{% block content %}
<div style="max-width:440px;margin:60px auto;text-align:center;">
  <div class="card" style="padding:32px;">
    <i class="fas fa-envelope-open-text" style="font-size:2.5rem;color:var(--brand);margin-bottom:18px;"></i>
    <h1 style="font-size:1.3rem;margin:0 0 8px;">Check your email</h1>
    <p style="color:var(--text-2);font-size:.88rem;">If that email address exists in our system, you'll receive a reset link shortly.</p>
    <a href="{% url 'finnovaapp:login' %}" class="btn btn-outline btn-sm" style="margin-top:18px;">Back to sign in</a>
  </div>
</div>
{% endblock %}
