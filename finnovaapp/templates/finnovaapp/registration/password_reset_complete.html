{% extends 'finnovaapp/base.html' %}
{% block title %}Password reset — Finnova{% endblock %}
{% block content %}
<div style="max-width:440px;margin:60px auto;text-align:center;">
  <div class="card" style="padding:32px;">
    <i class="fas fa-check-circle" style="font-size:2.5rem;color:var(--green);margin-bottom:18px;"></i>
    <h1 style="font-size:1.3rem;margin:0 0 8px;">Password updated</h1>
    <p style="color:var(--text-2);">Your password has been changed successfully.</p>
    <a href="{% url 'finnovaapp:login' %}" class="btn btn-primary" style="margin-top:18px;">Sign in</a>
  </div>
</div>
{% endblock %}
